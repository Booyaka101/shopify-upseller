app = "boopug-upsell"
primary_region = "hkg"

# Use the Dockerfile in the project root for builds
[build]
  dockerfile = "Dockerfile"

# HTTP service configuration for Fly Machines
[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
  
  # Health check
  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "10s"
    timeout = "2s"
    grace_period = "10s"

# Persistent storage for SQLite database at /app/data
[[mounts]]
  source = "data"
  destination = "/app/data"
